[package]
name = "shared"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10"
base64 = "0.22"
thiserror = "2.0"
urlencoding = "2.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
rand = "0.8"

[features]
default = []
